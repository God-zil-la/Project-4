{% extends "base.html" %}
{% block title %}Register{% endblock %}

{% block content %}
<h2>Create an Account</h2>

{% if messages %}
<ul class="messages">
    {% for message in messages %}
    <li{% if message.tags %} class="{{ message.tags }}" {% endif %}>{{ message }}</li>
        {% endfor %}
</ul>
{% endif %}

<form method="post" class="form-wrapper">
    {% csrf_token %}

    <div class="form-group">
        <label for="id_username">Username:</label>
        <input id="id_username" type="text" name="username" value="{{ username }}" required autocomplete="username">
    </div>

    <div class="form-group">
        <label for="id_email">Email:</label>
        <input id="id_email" type="email" name="email" value="{{ email }}" required autocomplete="email">
    </div>

    <div class="form-group">
        <label for="id_password">Password:</label>
        <input id="id_password" type="password" name="password" required autocomplete="new-password">
    </div>

    <div class="form-group">
        <label for="id_password2">Confirm Password:</label>
        <input id="id_password2" type="password" name="password2" required autocomplete="new-password">
    </div>

    <button type="submit" class="nav-btn">Register</button>
</form>

<style>
    :root {
        --bg-color: #111;
        --input-bg: #222;
        --input-border: #444;
        --input-text: #f0f0f0;
        --button-bg: #333;
        --button-hover-bg: #444;
        --button-text: #f0f0f0;
        --messages-bg: #222;
        --messages-text: #f0f0f0;
    }

    .form-wrapper {
        max-width: 400px;
        margin: 2rem auto;
        padding: 2rem;
        background: var(--bg-color);
        border-radius: 12px;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
        color: var(--input-text);
    }

    .form-group {
        margin-bottom: 1.5rem;
        display: flex;
        flex-direction: column;
    }

    .form-group label {
        margin-bottom: 0.5rem;
        font-weight: 600;
        color: var(--input-text);
    }

    .form-group input {
        padding: 0.65rem;
        border-radius: 6px;
        border: 1px solid var(--input-border);
        background: var(--input-bg);
        color: var(--input-text);
        font-size: 1rem;
        caret-color: var(--input-text);
    }

    .form-group input:focus {
        outline: none;
        border-color: #888;
        box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.2);
    }

    .nav-btn {
        background: var(--button-bg);
        color: var(--button-text);
        padding: 0.75rem 1.5rem;
        border: none;
        border-radius: 6px;
        cursor: pointer;
        width: 100%;
        font-weight: 600;
        transition: background 0.3s ease;
    }

    .nav-btn:hover {
        background: var(--button-hover-bg);
    }

    ul.messages {
        list-style: none;
        padding: 0;
        margin-bottom: 1.5rem;
    }

    ul.messages li {
        background: var(--messages-bg);
        padding: 0.75rem;
        border-radius: 6px;
        margin-bottom: 0.5rem;
        color: var(--messages-text);
        border: 1px solid var(--input-border);
    }
</style>
{% endblock %}
