{% extends "base.html" %}
{% block title %}Register{% endblock %}

{% block content %}
<h2>Create an Account</h2>

{% if messages %}
<ul class="messages">
    {% for message in messages %}
    <li{% if message.tags %} class="{{ message.tags }}" {% endif %}>
        {{ message }}
        </li>
        {% endfor %}
</ul>
{% endif %}

<form method="post">
    {% csrf_token %}

    <div class="form-group">
        <label for="id_username">Username:</label><br>
        <input type="text" name="username" id="id_username" required value="{{ username|default:'' }}"
            autocomplete="username">
    </div><br>

    <div class="form-group">
        <label for="id_email">Email:</label><br>
        <input type="email" name="email" id="id_email" required value="{{ email|default:'' }}" autocomplete="email">
    </div><br>

    <div class="form-group">
        <label for="id_password">Password:</label><br>
        <input type="password" name="password" id="id_password" required autocomplete="new-password">
    </div><br>

    <div class="form-group">
        <label for="id_password_confirm">Confirm Password:</label><br>
        <input type="password" name="password_confirm" id="id_password_confirm" required autocomplete="new-password">
    </div><br>

    <button type="submit">Register</button>
</form>
{% endblock %}
