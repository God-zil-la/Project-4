{% extends "base.html" %}
{% block content %}
<div class="container" style="max-width: 500px; margin: auto; padding-top: 40px;">
    <h2 style="text-align: center;">Set a New Password</h2>

    {% if validlink %}
    <form method="post" style="margin-top: 20px;">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-primary w-100">Set New Password</button>
    </form>
    {% else %}
    <div class="alert alert-danger" role="alert" style="margin-top: 20px;">
        The password reset link is invalid, possibly because it has already been used. Please request a new one.
    </div>
    {% endif %}
</div>
{% endblock %}
