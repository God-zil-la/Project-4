{% extends "base.html" %}
{% block title %}Password Reset Complete{% endblock %}

{% block content %}
<style>
    .reset-complete-wrapper {
        max-width: 420px;
        margin: 3rem auto;
        padding: 2rem 1rem;
        border-radius: 12px;
        background-color: #111;
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.6);
        color: #f0f0f0;
        font-family: Arial, sans-serif;
        text-align: center;
    }

    .reset-complete-wrapper h2 {
        color: #fff;
        margin-bottom: 1rem;
        font-size: 1.8rem;
        font-weight: 600;
    }

    .reset-complete-wrapper p {
        color: #ccc;
        font-size: 1rem;
        line-height: 1.5;
        margin-bottom: 1rem;
    }

    .reset-complete-wrapper a {
        display: inline-block;
        padding: 0.5rem 1rem;
        background-color: #000;
        color: #fff;
        border: 2px solid #fff;
        border-radius: 6px;
        text-decoration: none;
        font-weight: 600;
        font-size: 1rem;
        transition: all 0.3s ease;
        margin-top: 1rem;
    }

    .reset-complete-wrapper a:hover {
        background-color: #111;
        border-color: #ccc;
        color: #ccc;
    }

    @media (max-width: 400px) {
        .reset-complete-wrapper {
            padding: 1.5rem 0.75rem;
        }

        .reset-complete-wrapper h2 {
            font-size: 1.5rem;
        }

        .reset-complete-wrapper a {
            font-size: 0.95rem;
        }
    }
</style>

<div class="reset-complete-wrapper">
    <h2>Password Reset Complete</h2>
    <p>Your password has been set successfully.</p>
    <a href="{% url 'accounts:login' %}">Log in with New Password</a>
</div>
{% endblock %}
