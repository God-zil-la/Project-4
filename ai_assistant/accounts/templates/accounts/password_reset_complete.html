{% extends "base.html" %}
{% block title %}Password Reset Complete{% endblock %}

{% block content %}
<style>
    .reset-complete-wrapper {
        max-width: 420px;
        margin: 3rem auto;
        padding: 2rem;
        border-radius: 12px;
        background-color: #111;
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.6);
        color: #f0f0f0;
        font-family: Arial, sans-serif;
        text-align: center;
    }

    .reset-complete-wrapper h2 {
        color: #FFD700;
        margin-bottom: 1rem;
    }

    .reset-complete-wrapper p {
        color: #ccc;
        font-size: 1rem;
    }

    .reset-complete-wrapper a {
        color: #FFD700;
        text-decoration: none;
        font-weight: bold;
        transition: color 0.3s ease;
    }

    .reset-complete-wrapper a:hover {
        color: #e6c200;
        text-decoration: underline;
    }
</style>

<div class="reset-complete-wrapper">
    <h2>Password Reset Complete</h2>
    <p>Your password has been set. You can now <a href="{% url 'accounts:login' %}">log in</a> with the new password.
    </p>
</div>
{% endblock %}
