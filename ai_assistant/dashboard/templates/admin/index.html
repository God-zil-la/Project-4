<!-- ai_assistant/dashboard/templates/dashboard/index.html -->
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>AI Assistant Home</title>
</head>

<body>
    <h1>Ask the AI Assistant</h1>

    <form method="post">
        {% csrf_token %}
        <textarea name="message" rows="4" cols="50" placeholder="Type your question here..."></textarea><br>
        <button type="submit">Send</button>
    </form>

    {% if bot_response %}
    <h2>Bot Response:</h2>
    <p>{{ bot_response }}</p>
    {% endif %}
</body>

</html>
