{% extends 'base.html' %}
{% block content %}
<h2>Delete Bot</h2>
<p>Are you sure you want to delete "{{ bot.name }}"?</p>
<form method="POST">
    {% csrf_token %}
    <button type="submit">Confirm Delete</button>
</form>
<a href="{% url 'bots:list' %}" class="btn btn-secondary">Cancel</a>

{% endblock %}
