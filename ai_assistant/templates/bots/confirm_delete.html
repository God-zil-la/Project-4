{% extends 'base.html' %}

{% block title %}Delete Assistant - AI Assistant{% endblock %}

{% block content %}

<section class="delete-assistant-page">

    <div class="delete-assistant-card">

        <div class="delete-assistant-icon">
            🗑️
        </div>

        <div class="delete-assistant-content">

            <span class="delete-assistant-eyebrow">
                Delete assistant
            </span>

            <h1>
                Delete {{ bot.name }}?
            </h1>

            <p>
                This will permanently delete
                <strong>{{ bot.name }}</strong>
                from your account.
            </p>

            <div class="delete-assistant-warning">
                <strong>This action cannot be undone.</strong>
            </div>

        </div>


        <form
            method="post"
            class="delete-assistant-actions"
        >

            {% csrf_token %}

            <a
                href="{% url 'bots:list' %}"
                class="delete-assistant-cancel"
            >
                Cancel
            </a>

            <button
                type="submit"
                class="delete-assistant-confirm"
            >
                🗑️ Delete Assistant
            </button>

        </form>

    </div>

</section>


<style>

    /* ==================================================
       DELETE ASSISTANT
       ================================================== */

    main {
        width: min(900px, calc(100% - 2rem));
        max-width: none;
        margin: 1rem auto;
        padding: 0;
        background: transparent;
        border-radius: 0;
        box-shadow: none;
        backdrop-filter: none;
    }


    .delete-assistant-page {
        min-height: calc(100vh - 220px);

        display: flex;
        align-items: center;
        justify-content: center;

        width: 100%;
    }


    .delete-assistant-card {
        width: min(680px, 100%);

        display: grid;

        grid-template-columns:
            auto
            minmax(0, 1fr);

        gap: 1rem;

        padding: 1.25rem;

        background: var(--nav-bg);

        border: 1px solid var(--button-border);
        border-radius: 14px;

        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
    }


    .delete-assistant-icon {
        width: 54px;
        height: 54px;

        display: flex;
        align-items: center;
        justify-content: center;

        background: rgba(139, 0, 0, 0.12);

        border: 1px solid #8b0000;
        border-radius: 14px;

        font-size: 1.6rem;
    }


    .delete-assistant-content {
        min-width: 0;
    }


    .delete-assistant-eyebrow {
        display: block;

        margin-bottom: 0.15rem;

        font-size: 0.7rem;
        font-weight: 800;

        text-transform: uppercase;
        letter-spacing: 0.08em;

        opacity: 0.65;
    }


    .delete-assistant-content h1 {
        margin: 0;

        color: var(--accent-color);

        font-size: clamp(1.4rem, 3vw, 2rem);
        line-height: 1.2;
    }


    .delete-assistant-content p {
        margin: 0.55rem 0 0;

        font-weight: 600;
        line-height: 1.45;
    }


    .delete-assistant-warning {
        margin-top: 0.8rem;

        padding: 0.7rem 0.8rem;

        background: rgba(139, 0, 0, 0.08);

        border-left: 3px solid #8b0000;
        border-radius: 6px;

        font-size: 0.85rem;
    }


    /* ==================================================
       ACTIONS
       ================================================== */

    .delete-assistant-actions {
        grid-column: 1 / -1;

        display: flex;
        align-items: center;
        justify-content: flex-end;

        gap: 0.65rem;

        margin: 0;
        padding-top: 0.25rem;
    }


    .delete-assistant-cancel,
    .delete-assistant-confirm {
        display: inline-flex;
        align-items: center;
        justify-content: center;

        min-width: 150px;

        padding: 0.65rem 1rem;

        border-radius: 8px;

        font-size: 0.85rem;
        font-weight: 700;

        text-decoration: none;

        cursor: pointer;

        transition:
            background 0.2s ease,
            transform 0.2s ease;
    }


    .delete-assistant-cancel {
        background: var(--button-bg);
        color: var(--button-text);

        border: 1px solid var(--button-border);
    }


    .delete-assistant-confirm {
        background: linear-gradient(
            145deg,
            #8b0000,
            #5a0000
        );

        color: #ffffff;

        border: 1px solid transparent;
    }


    .delete-assistant-cancel:hover {
        background: var(--button-hover);
        transform: translateY(-1px);
    }


    .delete-assistant-confirm:hover {
        background: linear-gradient(
            145deg,
            #a80000,
            #6b0000
        );

        transform: translateY(-1px);
    }


    /* ==================================================
       MOBILE
       ================================================== */

    @media (max-width: 550px) {

        main {
            width: 100%;
            margin: 0;
            padding: 0.65rem;
        }


        .delete-assistant-page {
            min-height: calc(100vh - 180px);
        }


        .delete-assistant-card {
            grid-template-columns:
                auto
                minmax(0, 1fr);

            gap: 0.75rem;

            padding: 0.9rem;

            border-radius: 12px;
        }


        .delete-assistant-icon {
            width: 42px;
            height: 42px;

            font-size: 1.2rem;

            border-radius: 10px;
        }


        .delete-assistant-content h1 {
            font-size: 1.25rem;
        }


        .delete-assistant-content p {
            font-size: 0.78rem;
        }


        .delete-assistant-warning {
            padding: 0.6rem;

            font-size: 0.72rem;
        }


        .delete-assistant-actions {
            gap: 0.5rem;
        }


        .delete-assistant-cancel,
        .delete-assistant-confirm {
            flex: 1;

            min-width: 0;

            padding: 0.55rem 0.65rem;

            font-size: 0.72rem;
        }

    }


    @media (max-width: 360px) {

        .delete-assistant-card {
            grid-template-columns: 1fr;
        }


        .delete-assistant-icon {
            margin: 0 auto;
        }


        .delete-assistant-content {
            text-align: center;
        }


        .delete-assistant-warning {
            text-align: left;
        }


        .delete-assistant-actions {
            flex-direction: column;
        }


        .delete-assistant-cancel,
        .delete-assistant-confirm {
            width: 100%;
        }

    }

</style>

{% endblock %}
