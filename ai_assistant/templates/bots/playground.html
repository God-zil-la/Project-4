{% extends "base.html" %}
{% block title %}Chat with {{ bot.name }}{% endblock %}

{% block content %}
<h2>Chat with {{ bot.name }}</h2>
<p style="font-style: italic;">Personality: {{ bot.personality }}</p>

<div id="chat-box" class="chat-box" style="height: 300px; overflow-y: auto; border-radius: 8px;"></div>

<form id="chat-form" style="margin-top: 1rem;">
    {% csrf_token %}
    <input type="text" id="user-input" placeholder="Type your message..." autocomplete="off"
        style="width: 80%; padding: 0.5rem;" required>
    <button type="submit" class="btn">Send</button>
</form>

<script>
    const chatBox = document.getElementById('chat-box');
    const form = document.getElementById('chat-form');
    const input = document.getElementById('user-input');
    const ajaxUrl = "{% url 'bots:ajax_chat' bot.id %}";
    const fetchMessagesUrl = "{% url 'bots:bot_chat_api' bot.id %}";
    const csrfToken = document.querySelector('[name=csrfmiddlewaretoken]').value;

    function scrollToBottom() {
        chatBox.scrollTop = chatBox.scrollHeight;
    }

    function escapeHtml(unsafe) {
        return unsafe
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;");
    }

    function loadMessages() {
        fetch(fetchMessagesUrl, { credentials: 'same-origin' })
            .then(response => {
                if (!response.ok) {
                    if (response.status === 401) {
                        alert('⚠️ Please log in to chat.');
                    } else {
                        alert('Error loading messages.');
                    }
                    throw new Error('Failed to load messages');
                }
                return response.json();
            })
            .then(data => {
                chatBox.innerHTML = '';
                data.messages.forEach(msg => {
                    const msgDiv = document.createElement('div');
                    msgDiv.classList.add('chat-message', msg.sender);
                    msgDiv.innerHTML = `
                        <div class="sender">${msg.sender === 'user' ? 'You' : '{{ bot.name }}'}</div>
                        <div class="text">${escapeHtml(msg.message)}</div>
                    `;
                    chatBox.appendChild(msgDiv);
                });
                scrollToBottom();
            })
            .catch(console.error);
    }

    document.addEventListener("DOMContentLoaded", function () {
        loadMessages(); // load once on page load

        // Removed setInterval so no auto-refresh and scrolling is stable

        form.addEventListener('submit', function (e) {
            e.preventDefault();
            const message = input.value.trim();
            if (!message) return;

            fetch(ajaxUrl, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': csrfToken,
                },
                credentials: 'same-origin',
                body: JSON.stringify({ message })
            })
                .then(response => response.json().then(data => ({
                    status: response.status,
                    body: data
                })))
                .then(({ status, body }) => {
                    if (status === 429) {
                        // Show rate limit message inside chat box as bot message
                        const msgDiv = document.createElement('div');
                        msgDiv.classList.add('chat-message', 'bot');
                        msgDiv.innerHTML = `
                            <div class="sender">{{ bot.name }}</div>
                            <div class="text">${escapeHtml(body.response)}</div>
                        `;
                        chatBox.appendChild(msgDiv);
                        scrollToBottom();
                    } else if (!body.response) {
                        alert('Error sending message.');
                    } else {
                        input.value = '';
                        loadMessages();
                    }
                })
                .catch(err => {
                    console.error(err);
                    alert('Error sending message.');
                });
        });
    });
</script>

<style>
    .chat-box {
        padding: 1rem;
        background: var(--bg-color);
        color: var(--text-color);
        border: 1px solid var(--button-hover);
        border-radius: 8px;
        font-size: 1rem;
        overflow-wrap: break-word;
        word-break: break-word;
    }

    .chat-message.user {
        text-align: right;
        margin-bottom: 0.75rem;
    }

    .chat-message.bot {
        text-align: left;
        margin-bottom: 0.75rem;
    }

    .sender {
        font-weight: bold;
        margin-bottom: 0.25rem;
    }

    .text {
        background: var(--button-bg);
        color: var(--button-text);
        display: inline-block;
        padding: 0.5rem 0.75rem;
        border-radius: 10px;
        max-width: 80%;
        white-space: pre-wrap;
    }

    /* Light mode overrides */
    html:not(.dark) .text {
        background: var(--button-bg);
        color: var(--button-text);
    }

    /* Responsive input/button */
    #user-input {
        font-size: 1rem;
    }

    @media (max-width: 480px) {
        #user-input {
            width: 70%;
            font-size: 0.9rem;
        }

        button.btn {
            width: 25%;
            font-size: 0.9rem;
        }
    }
</style>
{% endblock %}
