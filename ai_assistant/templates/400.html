{% extends "base.html" %}

{% block title %}400 - Bad Request{% endblock %}

{% block content %}
<section class="content error-page">
    <div class="error-card">
        <h1>400 - Bad Request</h1>

        <p>
            Your request was invalid or malformed.
        </p>

        <a href="{% url 'home' %}" class="btn">
            Return Home
        </a>
    </div>
</section>

<style>
    .error-page {
        display: flex;
        justify-content: center;
        padding: 3rem 1rem;
    }

    .error-card {
        width: 100%;
        max-width: 560px;
        padding: 2rem;
        text-align: center;
        background: var(--nav-bg);
        color: var(--text-color);
        border: 1px solid var(--button-border);
        border-radius: 14px;
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.12);
    }

    .error-card h1 {
        margin-top: 0;
        margin-bottom: 1rem;
        color: var(--accent-color);
    }

    .error-card p {
        margin-bottom: 1.5rem;
        line-height: 1.6;
    }
</style>
{% endblock %}
