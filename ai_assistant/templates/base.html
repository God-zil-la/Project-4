{% load static %}
<!DOCTYPE html>
<html lang="en">
  <head>
    <script>
      // Apply theme before render to prevent white flash
      if (
        localStorage.getItem("theme") === "dark" ||
        (!("theme" in localStorage) &&
          window.matchMedia("(prefers-color-scheme: dark)").matches)
      ) {
        document.documentElement.classList.add("dark");
      }
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}AI Assistant{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'css/styles.css' %}" />
    <link rel="icon" href="{% static 'images/favicon.ico' %}" />
  </head>
  <body>
    <nav>
      <ul>
        <li><a href="/">Home</a></li>
        {% if user.is_authenticated %}
        <li><a href="/bots/">My Bots</a></li>
        <li><a href="/payments/">Billing</a></li>
        <li>
          <form
            method="POST"
            action="{% url 'accounts:logout' %}"
            class="nav-logout-form"
          >
            {% csrf_token %}
            <button type="submit" class="nav-btn">Logout</button>
          </form>
        </li>
        {% else %}
        <li><a href="/accounts/login/">Login</a></li>
        <li><a href="/accounts/register/">Register</a></li>
        {% endif %}
      </ul>
    </nav>

    <button id="toggleTheme" class="toggle-theme">Toggle Theme</button>

    <main>{% block content %}{% endblock %}</main>

    <footer>
      <p>&copy; 2025 AI Assistant. Developed By Mr.Husse</p>
    </footer>

    <script>
      const toggleButton = document.getElementById("toggleTheme");

      toggleButton?.addEventListener("click", () => {
        const html = document.documentElement;
        const isDark = html.classList.toggle("dark");
        localStorage.setItem("theme", isDark ? "dark" : "light");
      });
    </script>
  </body>
</html>
