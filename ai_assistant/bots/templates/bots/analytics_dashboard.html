{% extends 'base.html' %}
{% load static %}

{% block title %}Analytics Dashboard - AI Assistant{% endblock %}

{% block content %}
<main class="analytics-dashboard container" role="main" aria-label="Analytics Dashboard">
    <header class="dashboard-header">
        <h1>📊 Analytics Dashboard</h1>
        <p class="dashboard-intro">Insights into your AI bots and user interactions.</p>
    </header>

    <section class="chart-section" aria-labelledby="bot-usage-title">
        <h2 id="bot-usage-title" class="chart-title">Messages by Bot</h2>
        <canvas id="botUsageChart" role="img" aria-label="Bar chart showing messages count per bot"></canvas>
    </section>

    <section class="chart-section" aria-labelledby="user-usage-title">
        <h2 id="user-usage-title" class="chart-title">Messages by User</h2>
        <canvas id="userUsageChart" role="img" aria-label="Bar chart showing messages count per user"></canvas>
    </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script>
    const botData = JSON.parse('{{ bot_data|escapejs }}');
    const userData = JSON.parse('{{ user_data|escapejs }}');

    const chartOptions = {
        responsive: true,
        plugins: {
            legend: { display: false },
            tooltip: {
                mode: 'index',
                intersect: false,
                backgroundColor: 'rgba(0,0,0,0.75)',
                titleColor: '#FFD700',    // bright gold
                bodyColor: '#FFFFFF',     // white
                borderColor: '#FFD700',
                borderWidth: 1,
                caretSize: 6,
            },
        },
        scales: {
            y: {
                beginAtZero: true,
                ticks: { stepSize: 1, color: '#FFFFFF' },     // white text on y-axis ticks
                grid: { color: 'rgba(255,255,255,0.1)' },
                title: {
                    display: true,
                    text: 'Messages Count',
                    color: '#808080',                         // gold for y-axis title
                    font: { weight: '600' }
                }
            },
            x: {
                ticks: { color: '#FFFFFF', maxRotation: 45, minRotation: 30 },  // white text on x-axis ticks
                grid: { display: false },
                title: {
                    display: true,
                    text: 'Name',
                    color: '#808080',
                    font: { weight: '600' }
                }
            }
        }
    };

    new Chart(document.getElementById('botUsageChart'), {
        type: 'bar',
        data: {
            labels: botData.labels,
            datasets: [{
                label: 'Messages by Bot',
                data: botData.counts,
                backgroundColor: 'rgba(240, 165, 0, 0.85)',  // stronger gold
                borderColor: 'rgba(240, 165, 0, 1)',
                borderWidth: 1,
                borderRadius: 6,
                barPercentage: 0.6,
                categoryPercentage: 0.5,
            }]
        },
        options: chartOptions
    });

    new Chart(document.getElementById('userUsageChart'), {
        type: 'bar',
        data: {
            labels: userData.labels,
            datasets: [{
                label: 'Messages by User',
                data: userData.counts,
                backgroundColor: 'rgba(54, 162, 235, 0.85)',  // stronger blue
                borderColor: 'rgba(54, 162, 235, 1)',
                borderWidth: 1,
                borderRadius: 6,
                barPercentage: 0.6,
                categoryPercentage: 0.5,
            }]
        },
        options: chartOptions
    });
</script>

<style>
    .container {
        max-width: 900px;
        margin: 2rem auto 4rem;
        padding: 0 1rem;
    }

    .dashboard-header {
        text-align: center;
        margin-bottom: 3rem;
    }

    .dashboard-header h1 {
        font-size: 2.5rem;
        color: gray;
        font-weight: 800;
        margin-bottom: 0.25rem;
    }

    .dashboard-intro {
        font-size: 1.1rem;
        color: gray;
        font-weight: 500;
    }

    .chart-section {
        margin-bottom: 4rem;
    }

    .chart-title {
        font-size: 1.8rem;
        color: gray;
        margin-bottom: 1rem;
        font-weight: 700;
    }

    canvas {
        background: #1E1E1E;
        border-radius: 16px;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.6);
        padding: 1rem;
    }

    @media (max-width: 600px) {
        .dashboard-header h1 {
            font-size: 1.8rem;
        }

        .chart-title {
            font-size: 1.4rem;
        }
    }
</style>
{% endblock %}
