{% extends 'base.html' %}
{% load static %}

{% block title %}Analytics Dashboard - AI Assistant{% endblock %}

{% block content %}
<section class="analytics-dashboard container" aria-label="Analytics Dashboard">

    <header class="dashboard-header">
        <h1>📊 Analytics Dashboard</h1>
        <p class="dashboard-intro">
            Insights into your AI assistants and conversations.
        </p>
    </header>

    <section class="chart-section" aria-labelledby="bot-usage-title">
        <h2 id="bot-usage-title" class="chart-title">
            Messages by Assistant
        </h2>

        <canvas
            id="botUsageChart"
            role="img"
            aria-label="Bar chart showing message count per AI assistant">
        </canvas>
    </section>

    <section class="chart-section" aria-labelledby="time-usage-title">
        <h2 id="time-usage-title" class="chart-title">
            Messages Over Time
        </h2>

        <canvas
            id="timeUsageChart"
            role="img"
            aria-label="Bar chart showing messages over time">
        </canvas>
    </section>

</section>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script>
document.addEventListener('DOMContentLoaded', function () {
    const root = document.documentElement;
    const isDark = root.classList.contains('dark');

    const styles = getComputedStyle(root);
    const bgColor = styles.getPropertyValue('--nav-bg-solid').trim()
        || (isDark ? '#0b1b3f' : '#ebe4d8');
    const textColor = styles.getPropertyValue('--text-color').trim();
    const mutedColor = textColor;
    const gridColor = isDark
        ? 'rgba(255,255,255,0.1)'
        : 'rgba(0,0,0,0.05)';
    const gridSubColor = isDark
        ? 'rgba(255,255,255,0.05)'
        : 'rgba(0,0,0,0.03)';
    const tooltipBg = isDark ? '#162447' : '#f6f2eb';
    const accentColor = styles.getPropertyValue('--accent-color').trim() || '#15839d';

    const botData = JSON.parse(
        `{{ bot_data|default:"{}"|escapejs }}`
    );

    const timeData = JSON.parse(
        `{{ time_data|default:"{}"|escapejs }}`
    );

    function createChart(
        canvasId,
        label,
        data,
        color,
        xAxisTitle = 'Name'
    ) {
        const canvas = document.getElementById(canvasId);

        if (!canvas) {
            return;
        }

        const ctx = canvas.getContext('2d');

        new Chart(ctx, {
            type: 'bar',

            data: {
                labels: data.labels || [],
                datasets: [{
                    label: label,
                    data: data.counts || [],
                    backgroundColor: color,
                    borderColor: color,
                    borderWidth: 1,
                    borderRadius: 6,
                    barPercentage: 0.6,
                    categoryPercentage: 0.5
                }]
            },

            options: {
                responsive: true,
                maintainAspectRatio: false,

                plugins: {
                    legend: {
                        labels: {
                            color: textColor
                        }
                    },

                    tooltip: {
                        mode: 'index',
                        intersect: false,
                        backgroundColor: tooltipBg,
                        titleColor: textColor,
                        bodyColor: textColor,
                        borderColor: isDark ? '#888' : '#000',
                        borderWidth: 1,
                        caretSize: 6,
                        titleFont: {
                            weight: 'bold',
                            size: 14
                        },
                        bodyFont: {
                            size: 13
                        },
                        padding: 10
                    }
                },

                scales: {
                    y: {
                        beginAtZero: true,

                        ticks: {
                            stepSize: 1,
                            color: textColor
                        },

                        grid: {
                            color: gridColor
                        },

                        title: {
                            display: true,
                            text: 'Message Count',
                            color: mutedColor,
                            font: {
                                weight: '600'
                            }
                        }
                    },

                    x: {
                        ticks: {
                            color: textColor,
                            maxRotation: 45,
                            minRotation: 30
                        },

                        grid: {
                            color: gridSubColor
                        },

                        title: {
                            display: true,
                            text: xAxisTitle,
                            color: mutedColor,
                            font: {
                                weight: '600'
                            }
                        }
                    }
                }
            },

            plugins: [{
                id: 'customBackground',

                beforeDraw: chart => {
                    const chartCtx =
                        chart.canvas.getContext('2d');

                    chartCtx.save();
                    chartCtx.fillStyle = bgColor;
                    chartCtx.fillRect(
                        0,
                        0,
                        chart.width,
                        chart.height
                    );
                    chartCtx.restore();
                }
            }]
        });
    }

    createChart(
        'botUsageChart',
        'Messages by Assistant',
        botData,
        accentColor,
        'Name'
    );

    createChart(
        'timeUsageChart',
        'Messages Over Time',
        timeData,
        accentColor,
        'Date'
    );
});
</script>

<style>
.analytics-dashboard.container {
    width: min(1600px, 100%);
    max-width: none;
    margin: 0 auto;
    padding: 0;
}

.dashboard-header {
    margin-bottom: 0.8rem;
    padding: 0.9rem 1rem;
    background: var(--nav-bg);
    border: 1px solid var(--button-border);
    border-radius: 14px;
}

.dashboard-header h1 {
    margin: 0;
    color: var(--accent-color);
    font-size: clamp(1.45rem, 2.2vw, 2rem);
    line-height: 1.15;
}

.dashboard-intro {
    margin: 0.25rem 0 0;
    color: var(--text-color);
    font-size: 0.82rem;
    font-weight: 600;
    opacity: 0.8;
}

.chart-section {
    margin: 0 0 0.8rem;
    padding: 0.85rem;
    background: var(--nav-bg);
    border: 1px solid var(--button-border);
    border-radius: 14px;
    box-shadow: 0 6px 18px rgba(0, 0, 0, 0.05);
}

.chart-title {
    margin: 0 0 0.65rem;
    color: var(--accent-color);
    font-size: 0.95rem;
    font-weight: 800;
}

.chart-section canvas {
    display: block;
    width: 100% !important;
    height: 360px !important;
    padding: 0.65rem;
    background: var(--nav-bg);
    border: 1px solid var(--button-border);
    border-radius: 10px;
    box-shadow: none;
}

@media (min-width: 1200px) {
    .analytics-dashboard.container {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 0.8rem;
    }

    .dashboard-header {
        grid-column: 1 / -1;
        margin-bottom: 0;
    }

    .chart-section {
        margin-bottom: 0;
    }
}

@media (max-width: 550px) {
    .dashboard-header,
    .chart-section {
        padding: 0.75rem;
        border-radius: 12px;
    }

    .dashboard-header h1 {
        font-size: 1.3rem;
    }

    .dashboard-intro {
        font-size: 0.7rem;
    }

    .chart-section canvas {
        height: 300px !important;
        padding: 0.4rem;
    }
}
</style>
{% endblock %}
