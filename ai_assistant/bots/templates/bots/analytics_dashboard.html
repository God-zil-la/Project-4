{% extends 'base.html' %}
{% load static %}
{% block title %}Analytics Dashboard{% endblock %}

{% block content %}
<div class="container">
    <h1 class="text-center my-4">📊 Analytics Dashboard</h1>

    <div class="chart-container">
        <h2>Messages by Bot</h2>
        <canvas id="botUsageChart"></canvas>
    </div>

    <div class="chart-container mt-5">
        <h2>Messages by User</h2>
        <canvas id="userUsageChart"></canvas>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script>
    const botData = {{ bot_data| safe }};
    const userData = {{ user_data| safe }};

    new Chart(document.getElementById('botUsageChart'), {
        type: 'bar',
        data: {
            labels: botData.labels,
            datasets: [{
                label: 'Messages by Bot',
                data: botData.counts,
                backgroundColor: 'rgba(255, 206, 86, 0.6)',
                borderColor: 'rgba(255, 206, 86, 1)',
                borderWidth: 1
            }]
        },
        options: {
            responsive: true,
            plugins: { legend: { display: false } },
            scales: {
                y: {
                    beginAtZero: true,
                    ticks: { stepSize: 1 }
                }
            }
        }
    });

    new Chart(document.getElementById('userUsageChart'), {
        type: 'bar',
        data: {
            labels: userData.labels,
            datasets: [{
                label: 'Messages by User',
                data: userData.counts,
                backgroundColor: 'rgba(54, 162, 235, 0.6)',
                borderColor: 'rgba(54, 162, 235, 1)',
                borderWidth: 1
            }]
        },
        options: {
            responsive: true,
            plugins: { legend: { display: false } },
            scales: {
                y: {
                    beginAtZero: true,
                    ticks: { stepSize: 1 }
                }
            }
        }
    });
</script>

<style>
    .chart-container {
        max-width: 800px;
        margin: auto;
    }
</style>
{% endblock %}
